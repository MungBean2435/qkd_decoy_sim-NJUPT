name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: MATLAB 回归自检
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 公开仓库可自动获得许可；若改成私有仓库，需要配 MATLAB 批量许可 token
      - name: 安装 MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024a

      - name: 运行回归自检
        uses: matlab-actions/run-command@v2
        with:
          command: addpath(genpath(pwd)); runTests

      # Linux 无头环境没有中文字体，字体会退化为默认字体，
      # 这里只验证出图流程不报错，产物不作为发布用图
      - name: 出图流程冒烟测试
        uses: matlab-actions/run-command@v2
        with:
          command: addpath(genpath(pwd)); run_task1

      - name: 上传生成结果
        uses: actions/upload-artifact@v4
        with:
          name: figures
          path: |
            results/*.png
            results/*.csv
          if-no-files-found: warn
